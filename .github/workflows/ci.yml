name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Tests (race detector)
        run: go test -race -count=1 ./...

      - name: Static analysis
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Console script syntax
        run: node --check pkg/dashboard/static/app.js

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg VERSION="${GITHUB_SHA::8}" -t hf2s3:ci .
      - name: Entrypoint refuses to run without secrets
        run: |
          set +e
          out="$(docker run --rm hf2s3:ci 2>&1)"; code=$?
          echo "$out"
          test "$code" -ne 0
          echo "$out" | grep -q "HF2S3_MASTER_KEY"
      - name: Keygen works and the generated configuration starts
        run: |
          docker run --rm hf2s3:ci /app/hf2s3 keygen > /tmp/gen.env 2>/dev/null
          docker run -d --name hf2s3-smoke --env-file /tmp/gen.env -e HF2S3_DB=/data/x.db hf2s3:ci
          for i in $(seq 1 30); do
            if docker exec hf2s3-smoke wget -qO- http://127.0.0.1:8080/api/ready >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          docker logs hf2s3-smoke
          test "${ok:-0}" = 1
          # The gateway process itself must not run as root (docker exec would show the image user).
          uid="$(docker exec hf2s3-smoke sh -c 'for p in /proc/[0-9]*; do if tr "\0" " " < $p/cmdline 2>/dev/null | grep -q "^/app/hf2s3"; then awk "/^Uid:/ {print \$2; exit}" $p/status; fi; done | head -1')"
          echo "gateway uid: $uid"
          test "$uid" = 10001
